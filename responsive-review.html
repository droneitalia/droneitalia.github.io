<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verifica layout Drone Italia</title>
<style>body{margin:0;background:#e6ebf0;color:#132c43;font:14px system-ui}nav{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:10px;cursor:pointer}#frame{display:block;border:1px solid #788a9a;margin:0 auto 30px;box-sizing:content-box;background:#06162a}</style>
<nav aria-label="Dimensioni di verifica"><strong>Verifica layout</strong><button data-w="320" data-h="740">Telefono 320</button><button data-w="390" data-h="844">Telefono 390</button><button data-w="768" data-h="1024">Tablet 768</button><button data-w="1024" data-h="768">Tablet 1024</button><button data-w="1280" data-h="800">Desktop 1280</button><span id="size">390 × 844</span></nav>
<iframe id="frame" title="Sito nelle dimensioni selezionate" src="./?layout-check=33d7c4a6" width="390" height="844"></iframe>
<script>const frame=document.getElementById('frame');document.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{frame.width=b.dataset.w;frame.height=b.dataset.h;document.getElementById('size').textContent=b.dataset.w+' × '+b.dataset.h;}));</script></html>
