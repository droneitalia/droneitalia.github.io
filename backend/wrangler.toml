name = "drone-italia-diario"
main = "worker.mjs"
compatibility_date = "2026-10-29"
workers_dev = true
# Remain on the Workers Free account plan. Do not add R2 or a paid subscription.
[vars]
# Google Apps Script is the existing email gateway. Fill secrets after checking deployment.
MAIL_PROVIDER = "gas"
EMAIL_FROM = ""
ADMIN_EMAIL = ""
[[d1_databases]]
binding = "DB"
database_name = "drone-italia-diario"
database_id = "REPLACE_WITH_FREE_D1_DATABASE_ID"
[triggers]
crons = ["0 * * * *"]
# Secrets: JOURNAL_OWNER_SECRET (>=32 chars), OPENAI_API_KEY,
# GAS_WEB_APP_URL and DRONE_ITALIA_SECRET from the existing Google Apps Script gateway.
# Set ADMIN_EMAIL in Apps Script properties, not in the browser.
